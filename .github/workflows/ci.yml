name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # GPUI's X11/Wayland backends and fontconfig.
  LINUX_DEPS: >-
    pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev
    libwayland-dev libfontconfig-dev libfreetype-dev

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  build:
    # These jobs make sure the app keeps building. macOS also runs the full
    # test suite. Windows does not (the suite exercises Unix file modes,
    # symlinks and flock); it runs only the Windows path adapter and vault
    # operation tests, which guard the verbatim `\\?\` path handling.
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      # aws-lc on Windows: use its prebuilt assembly instead of needing NASM.
      AWS_LC_SYS_PREBUILT_NASM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo clippy --workspace --locked -- -D warnings

      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace --locked

      - name: Test the Windows path adapters and vault operations
        if: runner.os == 'Windows'
        run: |
          cargo test -p frankmd-core --locked --test path_windows_test
          cargo test -p frankmd-fs --locked --test windows_compat_test
